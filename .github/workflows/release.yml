name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the app bundle
        env:
          APP_DIR: ${{ github.workspace }}/dist
          VERSION: ${{ github.ref_name }}
        run: ./scripts/make-app.sh

      - name: Zip the bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Roach Explorer.app" "RoachExplorer-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "RoachExplorer-${GITHUB_REF_NAME}.zip" > "RoachExplorer-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/RoachExplorer-${GITHUB_REF_NAME}.zip" \
            "dist/RoachExplorer-${GITHUB_REF_NAME}.zip.sha256" \
            --title "Roach Explorer ${GITHUB_REF_NAME}" \
            --generate-notes

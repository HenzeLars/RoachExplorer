name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      # No test target yet. When one exists, `swift test` belongs here.
